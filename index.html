<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Per Alessia</title>
    <style>
         :root {
            --bg-rosa-chiaro: #ffe5ec;
            --rosa-medio: #ffb3c1;
            --rosa-acceso: #ff758f;
            --rosa-scuro: #c9184a;
            --testo-colore: #590d22;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-rosa-chiaro);
            color: var(--testo-colore);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 15px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* Box Principale Mobile */
        
        .box-domanda {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(201, 24, 74, 0.12);
            border: 3px solid var(--rosa-medio);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        h1 {
            font-size: 1.7rem;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.3;
        }
        
        .sottotitolo-dolce {
            font-size: 1.1rem;
            margin-bottom: 25px;
            display: block;
            opacity: 0.9;
        }
        /* Bottoni Verticali per Mobile */
        
        .bottoni-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        
        button {
            width: 100%;
            padding: 18px;
            /* Tasto grande per il touch */
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        .btn-si {
            background-color: var(--rosa-acceso);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 117, 143, 0.3);
        }
        
        .btn-no {
            background-color: var(--rosa-medio);
            color: var(--testo-colore);
        }
        /* Animazione Intermedia */
        
        .testo-intermedio {
            font-size: 2rem;
            font-weight: bold;
            color: var(--rosa-scuro);
            padding: 0 20px;
            line-height: 1.3;
            animation: fadeInOut 2.5s ease-in-out forwards;
        }
        /* Schermata Singola Foto */
        
        .contenuto-si {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .contenuto-si h1 {
            font-size: 1.9rem;
            color: var(--rosa-scuro);
            margin-bottom: 10px;
        }
        
        .testo-scuse {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        /* Container Foto Singola Grande */
        
        .singola-foto-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .singola-foto-container img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            /* Non supera il 70% dell'altezza dello schermo */
            object-fit: contain;
            /* Mantiene le proporzioni senza tagliare */
            border-radius: 20px;
            border: 6px solid white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        
        .hidden {
            display: none !important;
        }
        /* ANIMAZIONI */
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            15% {
                opacity: 1;
                transform: scale(1);
            }
            85% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.9);
            }
        }
    </style>
</head>

<body>

    <!-- 1. DOMANDA PRINCIPALE -->
    <div id="box-iniziale" class="box-domanda">
        <h1>Alessia, mi perdoni? 🥺</h1>


        <div class="bottoni-container">
            <button class="btn-si" onclick="gestisciRisposta('si')">Sì, ma portami il McFlurry</button>
            <button class="btn-no" onclick="gestisciRisposta('no')">Non lo so...</button>
        </div>
    </div>

    <!-- 2. TRANSIZIONE INTERMEDIA -->
    <div id="animazione-tranquilla" class="testo-intermedio hidden">
        Top allora passo al MC.
    </div>

    <!-- 3. SCHERMATA SINGOLA FOTO -->
    <div id="pagina-si" class="contenuto-si hidden">
        <h1>Giuro che non rispondero mai più a nessun messaggio</h1>
        <p class="testo-scuse">
            top mentre mi aspetti ecco una foto di un mcFlurry.
        </p>
        <div class="singola-foto-container">
            <!-- Metterai qui la tua immagine preferita rinominata immagine1.jpeg -->
            <img src="immagine5.jpg" alt="mcflurry">
        </div>
    </div>

    <!-- 4. SCHERMATA SE DICE "NON LO SO" -->
    <div id="pagina-no" class="box-domanda hidden">
        <h1>Eddai vengo in camper a portati un mcflurry</h1>
        <p style="font-size: 1.1rem; margin-top: 15px; line-height: 1.5;"> </p>
    </div>

    <script>
        function gestisciRisposta(scelta) {
            document.getElementById('box-iniziale').classList.add('hidden');

            if (scelta === 'si') {
                const testoIntermedio = document.getElementById('animazione-tranquilla');
                testoIntermedio.classList.remove('hidden');

                setTimeout(() => {
                    testoIntermedio.classList.add('hidden');

                    const paginaFoto = document.getElementById('pagina-si');
                    paginaFoto.classList.remove('hidden');

                    // Ottimizzazione layout per scorrere la foto singola
                    document.body.style.alignItems = 'flex-start';
                    document.body.style.paddingTop = '40px';
                    document.body.style.paddingBottom = '40px';
                }, 2500);

            } else {
                document.getElementById('pagina-no').classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
